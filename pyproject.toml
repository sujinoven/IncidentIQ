[project]
name = "incidentiq"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sujinoven", email = "sujinoven02@gmail.com" }
]

dependencies = [
    "chromadb>=1.5.9",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "mcp>=1,<2",
    "pydantic>=2,<3",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
]

[project.scripts]
incidentiq = "incidentiq:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentiq"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
